name: build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build (Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Test root package
        run: npm test -- --runInBand

      - name: Build root package
        run: npm run build

      - name: Pack root CLI package
        run: npm pack --dry-run

      - name: Build and pack direflow-component
        run: |
          cd packages/direflow-component
          npm ci
          npm run build
          npm pack --dry-run

      - name: Build and pack direflow-scripts
        run: |
          cd packages/direflow-scripts
          npm ci
          npm run build
          npm pack --dry-run
